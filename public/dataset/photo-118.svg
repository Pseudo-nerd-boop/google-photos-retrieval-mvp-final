<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-photo-118" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-photo-118)" />

  <!-- Visual Card Content -->
  <g filter="url(#shadow)">
    <rect x="60" y="60" width="680" height="480" rx="16" fill="#ffffff" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />

    <!-- Icon/Illustration Center -->
    <text x="400" y="240" font-family="sans-serif" font-size="64" text-anchor="middle" fill="#1e293b">📷</text>

    <!-- Title / Content -->
    <text x="400" y="320" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#0f172a">Night Market Shopping in Arpora Goa</text>

    <!-- Subtitle Category Badge -->
    <rect x="330" y="350" width="140" height="32" rx="16" fill="#0284c7" />
    <text x="400" y="371" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">PHOTO</text>

    <!-- Location & Date -->
    <text x="400" y="420" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#475569">📍 Goa | 🗓️ 2024-12-17</text>

    <!-- Tags Footer -->
    <text x="400" y="460" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#64748b">Tags: night market, shopping, lights, stalls</text>
  </g>

  <!-- ID Badge Header -->
  <rect x="80" y="80" width="110" height="30" rx="6" fill="#0f172a" />
  <text x="135" y="100" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">photo-118</text>
</svg>